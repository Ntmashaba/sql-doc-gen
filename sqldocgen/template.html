  "TRUNCATE TRY UNION UNIQUE UNPIVOT UPDATE USE USING VALUES VIEW WHEN WHERE WHILE WITH XACT_ABORT LOCAL FAST_FORWARD STATIC " +

function codeLines(tid, from, to, marks = [], opts = {}) {

    else if (direct && !cur.direct) { Object.assign(cur, {direct: true, depth: Math.min(depth, cur.depth), role, via}); q.push(id); }

    if (!indirect || n.step == null || n.op === "local" || doneSteps.has(n.step)) continue;
    doneSteps.add(n.step);   // step-level reads are indirect for every column the step writes: walk them once
    const st = STEP[n.step]; if (!st) continue;
    st.uses.forEach(u => u.defs.forEach(d => visit(d, false, d0, u.role, id)));
    st.conditions.forEach(c => { if (!c.step || !STEP[c.step]) return; STEP[c.step].uses.forEach(u => u.defs.forEach(d => visit(d, false, d0, "condition", id))); });

}

/* ============================================================ data flow */
function dataflowGraph() {
  const keep = r => (!["variable", "parameter", "system"].includes(r.kind) || r.output) && (DF_LOGS || !r.logging);
  const edges = new Map();
  const relsOf = st => {
    const reads = new Set(st.reads.filter(k => REL[k]));
    st.uses.forEach(u => { if (REL[u.rel] && u.col === ROWS) reads.add(u.rel); });
    st.nodes.forEach(nid => (NODES[nid].uses || []).forEach(u => { if (REL[u.rel] && u.rel !== NODES[nid].rel) reads.add(u.rel); }));
    return reads;
  };
  DATA.steps.forEach(st => {
    const writes = new Set(st.writes.filter(k => REL[k]));
    if (!writes.size) return;
    relsOf(st).forEach(a => writes.forEach(b => {
      if (a === b) return;
      const k = a + "\u0000" + b;
      if (!edges.has(k)) edges.set(k, {from: a, to: b, steps: [], cond: true, dyn: false});
      const e = edges.get(k); e.steps.push(st.id);

  let es = [...edges.values()];

    const inT = es.some(e => e.to === r.key && REL[e.from] && REL[e.from].kind !== "variable");
    const outT = es.some(e => e.from === r.key && REL[e.to] && !["variable", "parameter"].includes(REL[e.to].kind));
    if (inT && outT) varKeep.add(r.key);
  });
  const used = new Set();
  es = es.filter(e => (keep(REL[e.from]) || varKeep.has(e.from)) && (keep(REL[e.to]) || varKeep.has(e.to)));
  es.forEach(e => { used.add(e.from); used.add(e.to); });
  DATA.relations.forEach(r => { if ((r.role === "input" || r.role === "output" || r.role === "both") && keep(r)) used.add(r.key); });
  const cls = r => r.kind === "variable" ? "n-var" : r.kind === "result" || r.kind === "return" || r.kind === "parameter" ? "n-res" :
    r.kind === "dynamic" ? "n-dyn" : r.role === "input" ? "n-src" : r.role === "both" ? "n-both" : r.role === "output" ? "n-snk" : "n-mid";

    return {id: k, label: r.name, kind: KIND_NAMES[r.kind] || r.kind, sub: r.kind === "result" ? plural((r.columns || []).length, "column") : (r.ops || []).join(" · "),
      cls: cls(r) + (SEL_REL === k ? " n-focus" : ""), go: ["dfnode", k], title: r.name}; });
  const gedges = es.map(e => ({from: e.from, to: e.to, cls: (e.dyn ? "e-dyn " : "") + (e.cond ? "e-cond" : ""),
    title: `${relName(e.from)} → ${relName(e.to)}: step${e.steps.length > 1 ? "s" : ""} ${e.steps.map(s => STEP[s].label).join(", ")}${e.cond ? " (conditional)" : ""}`}));
  return {nodes, edges: gedges};
}

    + `<span class="sn">${esc(st.label)}</span><span class="kw k-${KIND_CLASS[st.kind] || ""}">${esc(KIND_LABEL[st.kind] || st.kind)}</span>`
    + `<span class="sm">${md(st.summary)}${st.reachable ? "" : ' <span class="never">never runs</span>'}</span>`

/* ============================================================ control flow */
function fstep(st) {
  const k = KIND_CLASS[st.kind] || "";
  const iss = st.issues.some(i => DATA.issues[i] && (DATA.issues[i].severity === "high" || DATA.issues[i].severity === "medium"));
  const txt = st.summary.replace(/`/g, "");

}
const PLAIN = new Set(["insert", "update", "delete", "merge", "select", "select-into", "select-assign", "set", "declare", "declare-table", "create-table", "drop-table", "truncate", "print", "set-option", "fetch", "open-cursor", "close-cursor", "deallocate-cursor", "declare-cursor", "insert-exec", "alter-table", "create-index", "other", "label"]);

function flowSeq(sid, depth = 0) {
  const sc = SCOPE[sid], items = sc.items;
  const out = [];
  let run = [], hidden = 0;
  const lanes = depth ? "fbranches stack" : "fbranches";
  const flush = () => {
    if (run.length > 5) {
      out.push(fstep(run[0]));
      const mid = run.slice(1, -1);
      out.push(`<details class="frun"><summary>${mid.length} more statements (steps ${esc(mid[0].label)}–${esc(mid[mid.length - 1].label)})</summary><div class="body flow">${mid.map(fstep).join('<div class="farrow"></div>')}</div></details>`);
      out.push(fstep(run[run.length - 1]));
    } else run.forEach(s => out.push(fstep(s)));
    run = [];
  };

    const [kind, id] = items[i];

      const owned = items.filter(([k, x]) => k === "scope" && SCOPE[x].step === id).map(([, x]) => SCOPE[x]);
      if (st.kind === "if") {
        flush();
        const then = owned.find(s => s.kind === "then"), els = owned.find(s => s.kind === "else");
        const arm = (s, cls, label) => `<div class="fbranch ${cls}"><div class="bl">${label}</div><div class="flow">${s ? flowSeq(s.id, depth + 1) : '<span class="mut">nothing</span>'}</div></div>`;
        out.push(`<div class="fblock">${fhead(id, "if", st.detail.predicate)}<div class="${els ? lanes : "fbranches stack"}">${arm(then, "then", "then")}${els ? arm(els, "else", "otherwise") : ""}</div></div>`);
      } else if (st.kind === "while") {
        flush();
        const body = owned.find(s => s.kind === "loop");
        out.push(`<div class="fblock loop">${fhead(id, "while", st.detail.predicate)}<div class="fbody"><div class="bl">each time round the loop</div><div class="flow">${body ? flowSeq(body.id, depth + 1) : ""}</div></div></div>`);
      } else if (owned.length && (st.kind === "exec" || st.kind === "exec-dynamic" || st.kind === "insert-exec")) {

        out.push(`<div class="fblock try"><div class="fbranches stack"><div class="fbranch try"><div class="bl">try</div><div class="flow">${flowSeq(s.id, depth + 1)}</div></div>
          ${nxt ? `<div class="fbranch catch"><div class="bl">if an error is raised</div><div class="flow">${flowSeq(nxt.id, depth + 1)}</div></div>` : ""}</div></div>`);
        if (nxt) i++;
      } else out.push(`<div class="fblock"><div class="fbody"><div class="bl">${esc(s.label)}</div><div class="flow">${flowSeq(s.id, depth + 1)}</div></div></div>`);
    }

  flush();
  if (hidden && !out.length) out.push(`<span class="mut">only housekeeping (${num(hidden)})</span>`);

}
function rControl() {

/* ============================================================ column trace */
function traceModel(key, indirect) {
  const o = OUT[key];
  const sl = backward(o.defs, indirect);
  const steps = new Map();
  const ensure = sid => { if (!steps.has(sid)) steps.set(sid, {sid, nodes: [], role: "rows", cond: false}); return steps.get(sid); };
  sl.forEach((info, id) => {
    const n = NODES[id];
    if (n.step == null) return;
    const e = ensure(n.step);
    e.nodes.push({id, direct: info.direct});
    if (info.direct) e.role = "value";
  });

  sl.forEach((info, id) => { const n = NODES[id]; if (n.op === "initial") (info.direct && n.col !== ROWS ? bases : decided).push(id); });

}

  DATA.calls.forEach((c, i) => {
    const id = "c" + i;
    const cls = c.kind === "dynamic" ? "n-dyn" : !c.supplied && !c.system ? "n-unknown" : c.kind === "function" ? "n-fn" : c.kind === "view" ? "n-src" : "n-proc";
    const st = c.expanded ? "expanded" : c.kind === "dynamic" ? "dynamic" : c.system ? "system" : c.supplied ? "supplied" : "not supplied";
    nodes.push({id, label: c.name, kind: `${c.kind} · ${st}`, cls, sub: "step " + c.steps.map(s => STEP[s] ? STEP[s].label : s).join(", "), go: ["step", c.steps[0]]});
    edges.push({from: me, to: id, cls: c.kind === "dynamic" ? "e-dyn" : "", title: `${P.name} → ${c.name}`});
  });
  const rows = DATA.calls.map(c => `<tr><td><code>${esc(c.name)}</code></td><td>${esc(c.kind)}${c.insertExec ? " (INSERT … EXEC)" : ""}</td><td>${stepLinks(c.steps)}</td>
    <td>${c.expanded ? '<span class="badge b-ok">expanded</span>' : c.kind === "dynamic" ? '<span class="badge b-warn">dynamic</span>' : c.system ? '<span class="badge b-muted">system</span>' : c.supplied ? '<span class="badge b-info">supplied</span>' : '<span class="badge b-bad">opaque</span>'}</td></tr>`).join("");
  return `<h1>Call graph</h1><p class="sub">Procedures, functions and views this code uses, and (with project input) the procedures that call it. Opaque calls were not supplied: what they do is unknown, not absent. Dynamic EXEC is marked.</p>
  <div class="legend"><span><i class="lg n-focus"></i>this procedure</span><span><i class="lg n-proc"></i>procedure</span><span><i class="lg n-fn"></i>function</span><span><i class="lg n-src"></i>view</span><span><i class="lg n-unknown"></i>not supplied</span><span><i class="lg e e-dyn"></i>dynamic SQL</span></div>
  <div class="graph">${svgGraph(nodes, edges, {id: "cg", w: 230, label: "call graph", fix: n => n.id.startsWith("caller") ? 0 : n.id === me ? (DATA.callers.length ? 1 : 0) : null})}</div>
  ${rows ? `<div class="table-wrap"><table class="t"><thead><tr><th>Called</th><th>Kind</th><th>Steps</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">This code calls no procedures, functions or views.</div>`}
  ${DATA.callers.length ? `<h2>Called by</h2><ul class="plain">${DATA.callers.map(c => `<li>${c.href ? `<a href="${esc(c.href)}">${esc(c.name)}</a>` : `<code>${esc(c.name)}</code>`} <span class="mut">${esc(c.file || "")}</span></li>`).join("")}</ul>` : ""}`;
}

/* ============================================================ review issues */
function rIssues() {
  const counts = {high: 0, medium: 0, low: 0, info: 0};
  DATA.issues.forEach(i => counts[i.severity] = (counts[i.severity] || 0) + 1);
  const list = DATA.issues.filter(i => ISSUE_FILTER === "all" || i.severity === ISSUE_FILTER);
  const chips = ["all", "high", "medium", "low", "info"].map(s => `<button class="chip${ISSUE_FILTER === s ? " on" : ""}" data-go="isf" data-arg="${s}">${s}<span class="n">${s === "all" ? DATA.issues.length : counts[s] || 0}</span></button>`).join("");
  const cards = list.map(i => {
    const marks = (i.spans || []).slice(0, 1).map(s => ({s: s[0], e: s[1], cls: "m-s"}));
    const code = i.spans && i.spans.length && TEXT[i.text] ? excerpt(i.text, i.spans[0], marks, 1, 12) : "";
    return `<div class="card issue ${i.severity}" id="iss-${i.id}"><div class="issue-head">${sevBadge(i.severity)}${i.certainty === "possible" ? '<span class="badge b-muted" title="Depends on data or definitions the code does not show">possible</span>' : ""}<span class="mut">${esc(i.rule)}</span></div>
      <b>${md(i.title)}</b><p class="why">${esc(i.why)}</p><p class="next"><b>Next step:</b> ${esc(i.next)}</p>
      <div style="margin-top:.4rem">${stepLinks(i.steps.slice(0, 10))} ${(i.columns || []).filter(k => OUT[k]).slice(0, 6).map(k => go("trace", k, "trace " + esc(colName(OUT[k].rel, OUT[k].col)), "chipref snk")).join(" ")}</div>${code}</div>`;
  }).join("");
  return `<h1>Review issues</h1><p class="sub">Ranked findings, each with why it matters and what to do next. <i>Possible</i> findings depend on data or definitions the code does not show.</p>
  <div class="filter-row">${chips} ${go("csv", "issues", "Download CSV", "ghost-btn")}</div>${cards || `<div class="empty"><b>Nothing to show.</b></div>`}`;
}
function rComplexity() {
  const c = DATA.complexity;
  const tiles = [["statements", "Statements"], ["lines", "Lines"], ["codeLines", "Lines of code"], ["nesting", "Deepest nesting"], ["cyclomatic", "Cyclomatic complexity"], ["maxJoins", "Most joins in one statement"]]
    .map(([k, l]) => `<div class="stat"><div class="big">${num(c[k])}</div><div class="lbl">${l}</div></div>`).join("");
  const dec = Object.entries(c.decisions || {}).filter(([, v]) => v).map(([k, v]) => `<span class="badge b-info">${esc(k)} ${v}</span>`).join(" ");
  const longest = c.longest.filter(x => x.lines > 1).map(x => `<tr><td>${stepLink(x.step)}</td><td>${num(x.lines)}</td><td>${md(STEP[x.step].summary)}</td></tr>`).join("");
  const scopes = c.scopes.filter(s => s.steps).sort((a, b) => b.steps - a.steps).slice(0, 25).map(s => `<tr><td>${esc(s.kind)}</td><td>${esc(s.label)}</td><td>${num(s.steps)}</td><td>${s.lines ? `${s.lines[0]}–${s.lines[1]}` : ""}</td></tr>`).join("");
  return `<h1>Complexity</h1><p class="sub">Size and branching. Cyclomatic complexity is 1 + the decision points (IF, WHILE, CASE WHEN, IIF, CATCH); above 50 a procedure is hard to test thoroughly.</p>
  <div class="stats">${tiles}</div><p style="margin:.6rem 0">${dec}</p>
  ${longest ? `<h2>Longest statements</h2><div class="table-wrap"><table class="t"><thead><tr><th>Step</th><th>Lines</th><th>Summary</th></tr></thead><tbody>${longest}</tbody></table></div>` : ""}
  <h2>Statements per scope</h2><div class="table-wrap"><table class="t"><thead><tr><th>Kind</th><th>Scope</th><th>Statements</th><th>Lines</th></tr></thead><tbody>${scopes}</tbody></table></div>`;
}

/* ============================================================ procedure details */
const DETAILS_ID = "sql-documentation-details";
const DETAIL_FIELDS = {owner: "Owner or team", job: "SQL Agent job / schedule", server: "Server and database", environment: "Environment (e.g. Production)",
  runbook: "Runbook or support page", sourceLocation: "Source location (repository, branch)", folder: "Home page group (e.g. Finance / Nightly)", notes: "Notes"};
function readDetails() {
  const el = document.getElementById(DETAILS_ID);
  let v = {};
  try { v = el ? JSON.parse(el.textContent) || {} : (DATA.details || {}); } catch (e) { v = DATA.details || {}; }
  const out = {}; Object.keys(DETAIL_FIELDS).forEach(k => out[k] = typeof v[k] === "string" ? v[k] : ""); return out;
}
const DETAILS = readDetails();
let SAVED_DETAILS = JSON.stringify(DETAILS);
const SECRET_RE = /\b(password|pwd|secret|accountkey|sharedaccesskey|sig|token|api[_-]?key)\s*=\s*[^;\s'"]+/i;
function captureDetails() {
  Object.keys(DETAIL_FIELDS).forEach(k => { const el = document.getElementById("det-" + k); if (el) DETAILS[k] = el.value; });
  const bar = document.getElementById("det-savebar"), status = document.getElementById("det-status"), btn = document.getElementById("det-save");
  if (!bar) return;
  const bad = Object.keys(DETAILS).filter(k => SECRET_RE.test(DETAILS[k]));
  const dirty = JSON.stringify(DETAILS) !== SAVED_DETAILS;
  bar.classList.toggle("dirty", dirty);
  if (bad.length) { status.textContent = "Remove what looks like a password, key or token: record where the secret lives instead."; btn.disabled = true; }
  else { status.textContent = dirty ? "Unsaved changes. Download the updated HTML and replace the original file to keep them." : "These details are stored in this file."; btn.disabled = !dirty; }
}
function saveDetailsHtml() {
  captureDetails();
  const clone = document.documentElement.cloneNode(true);
  const block = clone.querySelector("#" + DETAILS_ID);
  const json = JSON.stringify(DETAILS).replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026");
  if (block) block.textContent = json;
  const main = clone.querySelector("#main"); if (main) main.innerHTML = "";
  const nav = clone.querySelector("#nav"); if (nav) nav.innerHTML = "";
  const blob = new Blob(["<!DOCTYPE html>\n" + clone.outerHTML], {type: "text/html;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = DATA.documentationFilename || "procedure.html"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  SAVED_DETAILS = JSON.stringify(DETAILS); captureDetails();
  document.getElementById("det-status").textContent = "Downloaded. Replace the original HTML with the downloaded file to keep these details.";
}
function rDetails() {
  const field = k => k === "notes"
    ? `<label class="field wide"><span>${esc(DETAIL_FIELDS[k])}</span><textarea id="det-${k}" rows="4" oninput="captureDetails()">${esc(DETAILS[k])}</textarea></label>`
    : `<label class="field"><span>${esc(DETAIL_FIELDS[k])}</span><input id="det-${k}" value="${esc(DETAILS[k])}" oninput="captureDetails()"></label>`;
  const texts = Object.values(TEXT);
  return `<h1>Procedure details</h1>
  <p class="sub">Who owns this procedure, where and when it runs, and how to support it. These details are kept in this file, survive regeneration over the same file, and are shown on the library home page. Record references only: never passwords, keys or tokens.</p>
  ${DATA.published ? `<div class="card kvl">${Object.keys(DETAIL_FIELDS).map(k => `<div class="k">${esc(DETAIL_FIELDS[k])}</div><div>${esc(DETAILS[k] || "Not recorded")}</div>`).join("")}</div>`
    : `<div class="card details-grid">${Object.keys(DETAIL_FIELDS).map(field).join("")}</div>
  <div id="det-savebar" class="savebar"><p id="det-status" role="status"></p><button class="primary-btn" id="det-save" onclick="saveDetailsHtml()">Download updated HTML</button></div>`}
  <h2>How this document was generated</h2>
  <div class="card kvl">
    <div class="k">Generated</div><div>${esc(DATA.generated)} by ${esc(DATA.generator)} ${esc(DATA.generatorVersion)} (payload version ${esc(DATA.schemaVersion)})</div>
    <div class="k">Parser</div><div>Microsoft ScriptDom ${esc(DATA.parser.scriptDom || "")} · ${esc(DATA.parser.parser || "")}${DATA.parser.passes > 1 ? " · second pass for rebuilt dynamic SQL" : ""}</div>
    <div class="k">Mode</div><div>${esc(DATA.mode)}</div>
    <div class="k">Source</div><div>${esc(P.source || "")}${P.lines ? `, lines ${P.lines[0]}–${P.lines[1]}` : ""}</div>
    <div class="k">Secrets withheld</div><div>${num(DATA.redactions || 0)}</div>
    <div class="k">Run history</div><div class="mut">Not available: this document is generated from code, not from executions.</div>
  </div>
  ${texts.length > 1 ? `<h2>Code included</h2><div class="table-wrap"><table class="t"><thead><tr><th>Text</th><th>From</th></tr></thead><tbody>${texts.map(t => `<tr><td>${esc(t.label || t.id)}</td><td class="mut">${esc(t.path || "rebuilt by sql-doc-gen")}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
}
AFTER.details = () => requestAnimationFrame(captureDetails);

/* ============================================================ CSV */
function csvCell(v) { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(name) {
  let rows = [];
  if (name === "inputs") rows = [["object", "kind", "columns_used", "read_by_steps"], ...ins.map(r => [r.name, r.kind, Object.keys(r.colReads || {}).join(" "), (r.reads || []).map(s => STEP[s].label).join(" ")])];
  else if (name === "outputs") rows = [["output", "kind", "operations", "written_by_steps"], ...outsRel.map(r => [r.name, r.kind, (r.ops || []).join(" "), (r.writes || []).map(s => STEP[s].label).join(" ")])];
  else if (name === "columns") rows = [["output", "column", "status", "direct_sources", "steps", "conditions"], ...outCols.map(o => [relName(o.rel), o.col, o.status, o.direct.map(([r, c]) => colName(r, c)).join("; "), o.steps.map(s => STEP[s].label).join(" "), o.conditions.map(c => (c.branch === "else" ? "NOT " : "") + c.text).join("; ")])];
  else if (name === "steps") rows = [["step", "kind", "first_line", "last_line", "summary", "reads", "writes", "section", "role", "housekeeping_reason"], ...DATA.steps.map(s => [s.label, s.kind, s.lines ? s.lines[0] : "", s.lines ? s.lines[1] : "", s.summary.replace(/`/g, ""), s.reads.map(relName).join("; "), s.writes.map(relName).join("; "),
    SECTION[s.section] ? (SECTION[s.section].number + " " + SECTION[s.section].title).trim() : "", s.role || "logic", s.why || ""])];
  else if (name === "issues") rows = [["severity", "certainty", "rule", "title", "why", "next_step", "steps"], ...DATA.issues.map(i => [i.severity, i.certainty, i.rule, i.title, i.why, i.next, i.steps.map(s => STEP[s] ? STEP[s].label : s).join(" ")])];
  else if (name === "matrix") rows = [["output_column", ...DATA.matrixRelations.map(relName)], ...outCols.map(o => [colName(o.rel, o.col), ...DATA.matrixRelations.map(r => o.matrix[r] || "")])];
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${(P.name || "procedure").replace(/[^A-Za-z0-9_.-]+/g, "_")}-${name}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============================================================ boot */
const RENDER = {overview: rOverview, inputs: rInputs, outputs: rOutputs, intermediates: rIntermediates, columns: rColumns, dataflow: rDataflow,
  steps: rSteps, control: rControl, transforms: rTransforms, code: rCode, trace: rTrace, lineage: rLineage, matrix: rMatrix, calls: rCalls,
  issues: rIssues, complexity: rComplexity, details: rDetails};
buildNav();
(function start() {
  const h = (location.hash || "").slice(1);
  const m = /^trace=(.+)$/.exec(h);
  if (m && OUT[decodeURIComponent(m[1])]) { TRACE_KEY = decodeURIComponent(m[1]); switchTab("trace"); return; }
  if (TABS.find(t => t.id === h)) { switchTab(h); return; }
  switchTab("overview");
})();

/* ============================================================ library viewer bridge
   bi-doc-viewer protocol v1. Active only when this page is framed (by the library shell).
   Messages are accepted only from the parent window, with an exact shape; they carry a
   per-load channel, the revision ID and a registered view ID with string arguments,
   never HTML, scripts or URLs. */
const VIEWER_VIEWS = {
  "sql.overview": () => { switchTab("overview"); return true; },
  "sql.step": a => { const st = DATA.steps.find(s => s.label === a.step || s.id === a.step); if (!st) return false; GO.step(st.id); return true; },
  "sql.column": a => { const o = DATA.outputs.find(o => (relName(o.rel).toLowerCase() === String(a.relation || "").toLowerCase() || o.rel === a.relation) && o.col.toLowerCase() === String(a.column || "").toLowerCase()); if (!o) return false; GO.trace(o.key); return true; },
  "sql.object": a => { const r = DATA.relations.find(r => r.name.toLowerCase() === String(a.object || "").toLowerCase() || r.key === a.object); if (!r) return false; GO.rel(r.key); return true; },
  "sql.issue": a => { const i = DATA.issues.find(i => String(i.id) === String(a.issue) || i.rule === a.issue); if (!i) return false; GO.issue(i.id); return true; },
};
(function () {
  if (window.parent === window || !window.addEventListener) return;
  let channel = null, revision = null;
  const str = v => typeof v === "string" && v.length > 0 && v.length <= 512;
  const reply = msg => window.parent.postMessage(Object.assign({protocol: "bi-doc-viewer", version: 1, channel, revision_id: revision}, msg), "*");
  window.addEventListener("message", ev => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || typeof m !== "object" || m.protocol !== "bi-doc-viewer" || m.version !== 1) return;
    if (m.type === "hello") {
      if (channel !== null || !str(m.channel) || !str(m.revision_id)) return;
      channel = m.channel; revision = m.revision_id;
      reply({type: "viewer-ready", views: Object.keys(VIEWER_VIEWS)});
      return;
    }
    if (m.type !== "navigate-object" || m.channel !== channel || m.revision_id !== revision) return;
    if (!str(m.view_id) || !Object.prototype.hasOwnProperty.call(VIEWER_VIEWS, m.view_id)) return;
    const args = {};
    if (m.args && typeof m.args === "object") for (const [k, v] of Object.entries(m.args)) {
      if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") { const s = String(v); if (s.length <= 512) args[k] = s; }
    }
    let exact = false;
    try { exact = !!VIEWER_VIEWS[m.view_id](args); } catch (e) { exact = false; }
    reply({type: "navigated", object_id: str(m.object_id) ? m.object_id : null, exact});
  });
})();
