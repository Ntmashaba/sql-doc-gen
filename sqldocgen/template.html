/* control flow */

.fblock.dyn{border-color:#C4B5FD;background:#FAF7FF}.fblock.call{border-color:#99F6E4;background:#F7FFFD}

.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;vertical-align:bottom;max-height:220px;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:.74rem}

.conveyor .cell:first-child{border-radius:8px 8px 0 0;border-right-width:1.5px}.conveyor .cell:last-child{border-radius:0 0 8px 8px;border-left-width:1.5px}

@media print{nav{display:none}.layout{grid-template-columns:1fr}.codefull{max-height:none}}

<body>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<!--__DETAILS__-->
<script>
const DATA = /*__DATA__*/null;
/* ============================================================ helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString();
const plural = (n, w, p) => `${num(n)} ${n === 1 ? w : (p || w + "s")}`;
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const REL = {}; DATA.relations.forEach(r => REL[r.key] = r);
const STEP = {}, STEP_IDX = {}; DATA.steps.forEach((s, i) => { STEP[s.id] = s; STEP_IDX[s.id] = i; });
const NODES = DATA.nodes;
const SCOPE = {}; DATA.scopes.forEach(s => SCOPE[s.id] = s);
const OUT = {}; DATA.outputs.forEach(o => OUT[o.key] = o);
const LOCAL = {}; (DATA.locals || []).forEach(l => LOCAL[l.key] = l);
const TEXT = DATA.texts;
const P = DATA.procedure;
const ROWS = "(rows)";
const _ids = new Map();
const slug = s => { s = String(s); if (!_ids.has(s)) _ids.set(s, "i" + _ids.size); return _ids.get(s); };
const go = (kind, arg, label, cls = "xl", title = "") =>
  `<button class="${cls}" data-go="${kind}" data-arg="${esc(arg)}"${title ? ` title="${esc(title)}"` : ""}>${label}</button>`;
function flash(id) {
  const el = typeof id === "string" ? document.getElementById(id) : id;
  if (!el) return;
  el.scrollIntoView({block: "center"});
  if (el.tagName === "DETAILS") el.open = true;
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function relName(key) {
  if (REL[key]) return REL[key].name;
  const l = LOCAL[key];
  if (l) return l.name + ({cte: " (CTE)", view: " (view)", function: " (function)", values: " (VALUES)", pivot: " (pivot)"}[l.kind] || " (derived)");
  if (key.startsWith("system:")) return key.slice(7).toUpperCase();
  if (key.startsWith("unresolved:")) return key.slice(11) + " (unresolved)";

}
function colName(rel, col) {

  if (col === "value" && (!r || ["variable", "parameter", "return"].includes(r.kind) || rel.startsWith("system:"))) return relName(rel);
  if (col === ROWS) return "rows of " + relName(rel);
  if (col === "*") return relName(rel) + ".*";

}
const nodeLabel = id => colName(NODES[id].rel, NODES[id].col);
function versionLabel(id) {
  const n = NODES[id];
  if (n.step == null) return n.op === "initial" ? "before the procedure" : "";

  return s ? (n.op === "local" ? "inside step " : "after step ") + s.label : "";
}
function stepLink(id, label) {
  const s = STEP[id];
  if (!s) return "";
  return `<button class="steplink" data-go="step" data-arg="${esc(id)}" title="${esc(s.summary)}">${esc(label || "step " + s.label)}</button>`;
}
const stepLinks = ids => (ids || []).map(id => stepLink(id)).join(" ");
function relClass(key) {
  const r = REL[key];
  if (!r) return LOCAL[key] ? "mid" : "";
  if (r.role === "input") return "src";
  if (r.role === "output" || r.role === "both") return "snk";
  if (r.role === "intermediate") return "mid";
  return "";
}
const relChip = key => go("rel", key, esc(relName(key)), "chipref " + relClass(key));
const KIND_CLASS = {"insert": "w", "update": "w", "delete": "w", "merge": "w", "truncate": "w", "select-into": "w",
  "insert-exec": "w", "create-table": "w", "drop-table": "w", "alter-table": "w", "bulk-insert": "w", "declare-table": "w",
  "select": "r", "select-assign": "r", "open-cursor": "r", "fetch": "r", "declare-cursor": "r",
  "if": "c", "while": "c", "return": "e", "throw": "e", "raiserror": "e", "break": "c", "continue": "c", "goto": "c",
  "begin-tran": "t", "commit": "t", "rollback": "t", "save-tran": "t", "exec": "x", "exec-dynamic": "x", "nested-end": "c"};
const KIND_LABEL = {"select-into": "select into", "select-assign": "select @", "insert-exec": "insert exec", "exec-dynamic": "dynamic sql",
  "create-table": "create table", "drop-table": "drop table", "declare-table": "table var", "declare-cursor": "cursor",
  "open-cursor": "open cursor", "begin-tran": "begin tran", "set-option": "set option", "nested-end": "end", "alter-table": "alter table"};
const kindBadge = k => `<span class="kind k-${KIND_CLASS[k] || ""}">${esc(KIND_LABEL[k] || k)}</span>`;
const sevBadge = s => `<span class="badge b-${s === "info" ? "info2" : s}">${esc(s)}</span>`;
const statusBadge = s => `<span class="badge ${s === "resolved" ? "b-ok" : s === "partial" ? "b-warn" : "b-bad"}">${esc(s)}</span>`;
const lines = st => st && st.lines ? (st.lines[0] === st.lines[1] ? `line ${st.lines[0]}` : `lines ${st.lines[0]}–${st.lines[1]}`) : "";

/* ============================================================ code rendering */
const KW = new Set(("ADD ALL ALTER AND ANY APPLY AS ASC AUTHORIZATION BEGIN BETWEEN BREAK BULK BY CASCADE CASE CATCH CHECK " +
  "CLOSE CLUSTERED COLLATE COLUMN COMMIT CONSTRAINT CONTINUE CREATE CROSS CURRENT CURSOR DATABASE DEALLOCATE DECLARE DEFAULT " +
  "DELETE DESC DISTINCT DROP ELSE END ESCAPE EXCEPT EXEC EXECUTE EXISTS FETCH FOR FOREIGN FROM FULL FUNCTION GO GOTO GROUP HAVING " +
  "IDENTITY IF IN INDEX INNER INSERT INTERSECT INTO IS JOIN KEY LEFT LIKE MATCHED MERGE NEXT NOCOUNT NOLOCK NONCLUSTERED NOT NULL " +
  "OF OFF ON OPEN OPTION OR ORDER OUTER OUTPUT OVER PARTITION PERCENT PIVOT PRIMARY PRINT PROC PROCEDURE RAISERROR READONLY " +
  "RECOMPILE REFERENCES RETURN RETURNS ROLLBACK ROWS SAVE SCHEMA SELECT SET SOURCE TABLE TARGET THEN THROW TO TOP TRAN TRANSACTION " +
  "TRUNCATE TRY UNION UNIQUE UNPIVOT UPDATE USE USING VALUES VIEW WHEN WHERE WHILE WITH XACT_ABORT LOCAL FAST_FORWARD STATIC " +
  "FORWARD_ONLY READ_ONLY OUT OUTPUT MAXRECURSION TIES OFFSET ROW ONLY FIRST LAST").split(" "));
const TYPES = new Set(("INT BIGINT SMALLINT TINYINT BIT DECIMAL NUMERIC MONEY SMALLMONEY FLOAT REAL DATE DATETIME DATETIME2 " +
  "SMALLDATETIME DATETIMEOFFSET TIME CHAR VARCHAR NCHAR NVARCHAR TEXT NTEXT BINARY VARBINARY IMAGE UNIQUEIDENTIFIER XML SYSNAME").split(" "));
const TOKRE = /(--[^\n]*)|(\/\*[\s\S]*?(?:\*\/|$))|(N?'(?:[^']|'')*'?)|(\[(?:[^\]]|\]\])*\]?)|("(?:[^"]|"")*"?)|(@@?[A-Za-z_0-9$#@]+)|(##?[A-Za-z_0-9$#@]+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z_0-9$]*)/g;
function tokenize(text) {
  const out = []; let m; TOKRE.lastIndex = 0;
  while ((m = TOKRE.exec(text))) {
    let c = "";
    if (m[1] || m[2]) c = "c-cmt"; else if (m[3]) c = "c-str"; else if (m[4] || m[5]) c = "c-id";
    else if (m[6]) c = "c-var"; else if (m[7]) c = "c-tmp"; else if (m[8]) c = "c-num";
    else if (m[9]) { const u = m[9].toUpperCase(); c = KW.has(u) ? "c-kw" : (TYPES.has(u) ? "c-type" : ""); }
    if (c) out.push({s: m.index, e: m.index + m[0].length, c});
    if (m[0].length === 0) TOKRE.lastIndex++;

}
const _lineIdx = {}, _tokCache = {};
function lineIndex(tid) {
  if (_lineIdx[tid]) return _lineIdx[tid];
  const t = TEXT[tid].text, out = []; let s = 0;
  for (let i = 0; i <= t.length; i++) {
    if (i === t.length || t[i] === "\n") { out.push({s, e: (i > s && t[i - 1] === "\r") ? i - 1 : i}); s = i + 1; }
  }
  return _lineIdx[tid] = out;
}
function tokensOf(tid) { return _tokCache[tid] || (_tokCache[tid] = tokenize(TEXT[tid].text)); }
function lineOfOffset(tid, off) {
  const L = lineIndex(tid); let lo = 0, hi = L.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (L[mid].s <= off) lo = mid; else hi = mid - 1; }
  return lo + 1;
}
/* Lines [from, to] (local, 1-based) of a text with syntax colours and marks [{s,e,cls}]. */
function codeLines(tid, from, to, marks = [], opts = {}) {
  const T = TEXT[tid]; if (!T) return "";
  const L = lineIndex(tid);
  from = Math.max(1, from | 0); to = Math.min(L.length, to | 0);
  const toks = tokensOf(tid);
  let ti = 0, html = "";
  const marksSorted = marks.filter(m => m && m.e > m.s);
  const hitLines = opts.hit || null;
  while (ti < toks.length && toks[ti].e <= L[from - 1].s) ti++;
  for (let ln = from; ln <= to; ln++) {
    const ls = L[ln - 1].s, le = L[ln - 1].e;
    const bp = new Set([ls, le]);
    while (ti < toks.length && toks[ti].e <= ls) ti++;
    for (let k = ti; k < toks.length && toks[k].s < le; k++) { bp.add(Math.max(ls, toks[k].s)); bp.add(Math.min(le, toks[k].e)); }
    const lm = marksSorted.filter(m => m.e > ls && m.s < le);
    lm.forEach(m => { bp.add(Math.max(ls, m.s)); bp.add(Math.min(le, m.e)); });
    const pts = [...bp].sort((a, b) => a - b);
    let k = ti, body = "";
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1]; if (b <= a) continue;
      while (k < toks.length && toks[k].e <= a) k++;
      const tc = (k < toks.length && toks[k].s <= a) ? toks[k].c : "";
      const mc = lm.filter(m => m.s < b && m.e > a).map(m => m.cls).join(" ");
      const txt = esc(T.text.slice(a, b));
      body += (tc || mc) ? `<span class="${tc} ${mc}">${txt}</span>` : txt;
    }
    const abs = ln + (T.lineOffset || 0);
    const cls = hitLines && hitLines.has(ln) ? " hit" : "";
    const tag = opts.tags && opts.tags[ln] ? `<span class="sm-mark">${opts.tags[ln]}</span>` : "";
    html += `<div class="cl${cls}"${opts.anchor ? ` id="L-${slug(tid)}-${abs}"` : ""}><span class="ln">${abs}</span><span class="lc">${body || " "}${tag}</span></div>`;

}
/* An excerpt around a span (text offsets), with marks. */
function excerpt(tid, span, marks = [], pad = 0, maxLines = 40) {
  if (!TEXT[tid] || !span) return "";
  let a = lineOfOffset(tid, span[0]), b = lineOfOffset(tid, Math.max(span[0], span[1] - 1));
  a = Math.max(1, a - pad); b = b + pad;
  let more = "";
  if (b - a + 1 > maxLines) { more = `<div class="cl"><span class="ln">…</span><span class="lc" style="color:#94A3B8">${b - a + 1 - maxLines} more lines — open the step in Code to see all</span></div>`; b = a + maxLines - 1; }
  return `<div class="code">${codeLines(tid, a, b, marks)}${more}</div>`;
}

/* ============================================================ sections and views */
const SECTIONS = [
  {id: "overview", label: "Overview"},
  {id: "data", label: "Data & sources"},
  {id: "logic", label: "Logic & steps"},
  {id: "trace", label: "Trace & impact"},
  {id: "issues", label: "Review issues"},
  {id: "details", label: "Procedure details"},
];
const ins = DATA.relations.filter(r => (r.role === "input" || r.role === "both") && !["variable", "parameter"].includes(r.kind));
const outsRel = DATA.relations.filter(r => r.role === "output" || r.role === "both");
const mids = DATA.relations.filter(r => r.role === "intermediate");
const outCols = DATA.outputs.filter(o => o.col !== ROWS);
const TABS = [
  {id: "overview", section: "overview", label: "Overview", avail: () => true},
  {id: "inputs", section: "data", label: "Inputs", avail: () => ins.length > 0, count: () => ins.length,
   why: "This code reads no tables, views, functions or remote sources."},
  {id: "outputs", section: "data", label: "Outputs", avail: () => outsRel.length > 0, count: () => outsRel.length,
   why: "This code writes no tables and returns no result sets or output parameters."},
  {id: "intermediates", section: "data", label: "Intermediates", avail: () => mids.length + (DATA.locals || []).length +
     DATA.relations.filter(r => r.kind === "variable").length > 0,
   count: () => mids.length + (DATA.locals || []).filter(l => l.kind === "cte").length,
   why: "No temp tables, table variables, CTEs, cursors or variables."},
  {id: "columns", section: "data", label: "Columns", avail: () => outCols.length > 0, count: () => outCols.length,
   why: "No output columns were found."},
  {id: "dataflow", section: "data", label: "Data flow", avail: () => DATA.relations.length > 0},
  {id: "steps", section: "logic", label: "Steps", avail: () => DATA.steps.length > 0, count: () => DATA.counts.statements},
  {id: "control", section: "logic", label: "Control flow", avail: () => DATA.steps.length > 0},
  {id: "transforms", section: "logic", label: "Transformations", avail: () => DATA.transforms.length > 0,
   count: () => DATA.transforms.length, why: "No expression changes a value: every column is copied as it is."},
  {id: "code", section: "logic", label: "Code", avail: () => true},
  {id: "trace", section: "trace", label: "Column trace", avail: () => DATA.outputs.length > 0,
   why: "There is no output column to trace."},
  {id: "lineage", section: "trace", label: "Lineage graph", avail: () => DATA.outputs.length > 0},
  {id: "matrix", section: "trace", label: "Usage matrix", avail: () => outCols.length > 0 && DATA.matrixRelations.length > 0,
   why: "No output column reads a source table."},
  {id: "calls", section: "trace", label: "Call graph", avail: () => true, count: () => DATA.calls.length || null},
  {id: "issues", section: "issues", label: "Review issues", avail: () => true, count: () => DATA.issues.length || null},
  {id: "complexity", section: "issues", label: "Complexity", avail: () => true},
  {id: "details", section: "details", label: "Procedure details", avail: () => true},
];
const LAST_VIEW = {};
function buildNav() {
  const nav = document.getElementById("nav");
  const hi = DATA.summary.issues.high || 0;
  let html = `<div class="brand">SQL Doc Gen</div><div class="doc-title">${esc(DATA.title).replace(/([._])/g, "$1<wbr>")}</div>
    <div class="doc-sub">${esc(P.kind === "procedure" ? "stored procedure" : "script")}${P.database ? " · " + esc(P.database) : ""}</div>`;
  for (const sec of SECTIONS) {
    const n = sec.id === "issues" ? DATA.issues.filter(i => i.severity !== "info").length : null;
    html += `<button class="nav-btn" id="sec-${sec.id}" data-go="section" data-arg="${sec.id}">${sec.label}${n ? `<span class="n${hi ? " hot" : ""}">${n}</span>` : ""}</button>`;
  }
  html += `<div class="nav-foot"><b>Static analysis.</b> Generated ${esc(DATA.generated)} from ${esc(P.source || "the code")}. Mode: ${esc(DATA.mode)}.</div>`;
  nav.innerHTML = html;
}
function subtabs(sectionId, activeId) {
  const views = TABS.filter(t => t.section === sectionId);
  if (views.length < 2) return "";
  return `<div class="subtabs" role="tablist">${views.map(t => {
    const ok = t.avail(), c = ok && t.count ? t.count() : null;
    return ok ? `<button class="subtab${t.id === activeId ? " active" : ""}" role="tab" aria-selected="${t.id === activeId}" data-go="view" data-arg="${t.id}">${esc(t.label)}${c ? ` <span class="n">${num(c)}</span>` : ""}</button>`
              : `<button class="subtab disabled" title="${esc(t.why || "Not available for this input")}" aria-disabled="true" tabindex="-1">${esc(t.label)}</button>`;
  }).join("")}</div>`;
}
function openSection(id) {
  const views = TABS.filter(t => t.section === id && t.avail());
  const target = views.find(t => t.id === LAST_VIEW[id]) || views[0];
  if (target) switchTab(target.id);
}
let CURRENT = null; const VIEW_STATE = {};
function switchTab(id, keepScroll) {
  const tab = TABS.find(t => t.id === id);
  if (!tab || !tab.avail()) return;
  LAST_VIEW[tab.section] = id;
  document.querySelectorAll(".nav-btn").forEach(b => {
    const on = b.id === "sec-" + tab.section;
    b.classList.toggle("active", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const main = document.getElementById("main");
  if (CURRENT) VIEW_STATE[CURRENT] = {q: [...main.querySelectorAll("input.search")].map(i => i.value),
    open: [...main.querySelectorAll("details[open][id]")].map(d => d.id)};
  main.innerHTML = subtabs(tab.section, id) + RENDER[id]();
  CURRENT = id;

/* ============================================================ lineage walks (same rules as sqldocgen/trace.py) */
function backward(starts, indirect = true, limit = 20000) {
  const seen = new Map(), q = [];

  const visit = (id, direct, depth, role, via) => {
    if (NODES[id].op === "create") return;          // an empty table being created adds no rows or values
    const cur = seen.get(id);
    if (!cur) { if (seen.size >= limit) return; seen.set(id, {direct, depth, role, via}); q.push(id); }
    else if (direct && !cur.direct) { Object.assign(cur, {direct: true, depth: Math.min(depth, cur.depth), role, via}); q.push(id); }
  };
  const doneSteps = new Set();
  for (let qi = 0; qi < q.length; qi++) {
    const id = q[qi], info = seen.get(id), n = NODES[id], d0 = info.depth + 1;
    (n.uses || []).forEach(u => { if (!u.d && !indirect) return; u.defs.forEach(d => visit(d, info.direct && !!u.d, d0, u.role, id)); });
    if (!indirect || n.step == null || n.op === "local" || doneSteps.has(n.step)) continue;
    doneSteps.add(n.step);   // step-level reads are indirect for every column the step writes: walk them once
    const st = STEP[n.step]; if (!st) continue;
    st.uses.forEach(u => u.defs.forEach(d => visit(d, false, d0, u.role, id)));
    st.conditions.forEach(c => { if (!c.step || !STEP[c.step]) return; STEP[c.step].uses.forEach(u => u.defs.forEach(d => visit(d, false, d0, "condition", id))); });
  }

}

  NODES.forEach(n => { if (n.step != null) (byStep[n.step] = byStep[n.step] || []).push(n.id); });
  NODES.forEach(n => (n.uses || []).forEach(u => u.defs.forEach(d => add(d, n.id, !!u.d, u.role))));
  DATA.steps.forEach(st => {
    const tg = byStep[st.id] || [];
    st.uses.forEach(u => u.defs.forEach(d => tg.forEach(t => add(d, t, false, u.role))));
    st.conditions.forEach(c => { if (c.step && STEP[c.step]) STEP[c.step].uses.forEach(u => u.defs.forEach(d => tg.forEach(t => add(d, t, false, "condition")))); });

}

/* ============================================================ graph drawing */
function layout(nodes, edges, opt = {}) {
  const W = opt.w || 190, H = opt.h || 46, GX = opt.gx || 70, GY = opt.gy || 14, PAD = 16;
  const ids = nodes.map(n => n.id), byId = {};
  nodes.forEach(n => byId[n.id] = n);
  const out = {}, inn = {};
  ids.forEach(i => { out[i] = []; inn[i] = []; });
  edges.forEach(e => { if (out[e.from] && inn[e.to] && e.from !== e.to) { out[e.from].push(e.to); inn[e.to].push(e.from); } });
  // break cycles with an iterative DFS
  const state = {}, back = new Set();
  ids.forEach(root => {
    if (state[root]) return;
    const stack = [[root, 0]]; state[root] = 1;
    while (stack.length) {
      const top = stack[stack.length - 1], v = top[0];
      if (top[1] < out[v].length) {
        const w = out[v][top[1]++];
        if (state[w] === 1) back.add(v + "\u0000" + w);
        else if (!state[w]) { state[w] = 1; stack.push([w, 0]); }
      } else { state[v] = 2; stack.pop(); }
    }
  });
  const fwd = e => !back.has(e.from + "\u0000" + e.to) && e.from !== e.to;
  const layer = {};
  const indeg = {}; ids.forEach(i => indeg[i] = 0);
  edges.filter(fwd).forEach(e => { if (indeg[e.to] !== undefined && byId[e.from]) indeg[e.to]++; });
  const queue = ids.filter(i => indeg[i] === 0); queue.forEach(i => layer[i] = 0);
  for (let qi = 0; qi < queue.length; qi++) {
    const v = queue[qi];
    edges.filter(e => e.from === v && fwd(e) && byId[e.to]).forEach(e => {
      layer[e.to] = Math.max(layer[e.to] || 0, layer[v] + 1);
      if (--indeg[e.to] === 0) queue.push(e.to);
    });
  }
  ids.forEach(i => { if (layer[i] === undefined) layer[i] = 0; });
  if (opt.fix) ids.forEach(i => { const f = opt.fix(byId[i], layer[i]); if (f !== undefined && f !== null) layer[i] = f; });
  let maxL = Math.max(0, ...ids.map(i => layer[i]));
  if (opt.sinkLast) ids.forEach(i => { if (opt.sinkLast(byId[i])) layer[i] = maxL; });
  if (opt.reverse) ids.forEach(i => layer[i] = maxL - layer[i]);
  maxL = Math.max(0, ...ids.map(i => layer[i]));
  const cols = [];
  for (let l = 0; l <= maxL; l++) cols.push(ids.filter(i => layer[i] === l));
  const pos = {};
  cols.forEach(c => c.forEach((id, k) => pos[id] = k));
  for (let sweep = 0; sweep < 4; sweep++) {
    const order = sweep % 2 === 0 ? cols.map((c, i) => i) : cols.map((c, i) => cols.length - 1 - i);
    order.forEach(li => {
      const c = cols[li];
      const bary = id => { const nb = (sweep % 2 === 0 ? inn[id] : out[id]).filter(x => layer[x] !== layer[id]); return nb.length ? nb.reduce((s, x) => s + pos[x], 0) / nb.length : pos[id]; };
      c.sort((a, b) => bary(a) - bary(b) || (byId[a].label || "").localeCompare(byId[b].label || ""));
      c.forEach((id, k) => pos[id] = k);
    });
  }
  const maxRows = Math.max(1, ...cols.map(c => c.length));
  const xy = {};
  cols.forEach((c, l) => {
    const off = ((maxRows - c.length) * (H + GY)) / 2;
    c.forEach((id, k) => xy[id] = {x: PAD + l * (W + GX), y: PAD + 24 + off + k * (H + GY)});
  });
  return {xy, W, H, width: PAD * 2 + (maxL + 1) * W + maxL * GX, height: PAD * 2 + 24 + maxRows * (H + GY), cols, layer};
}
function svgGraph(nodes, edges, opt = {}) {
  if (!nodes.length) return `<div class="empty">Nothing to draw.</div>`;
  const L = layout(nodes, edges, opt), {xy, W, H} = L;
  const trunc = (s, n) => s && s.length > n ? s.slice(0, n - 1) + "…" : (s || "");
  let svg = `<svg class="graphsvg" width="${L.width}" height="${L.height}" viewBox="0 0 ${L.width} ${L.height}" role="img" aria-label="${esc(opt.label || "diagram")}">
  <defs><marker id="ar-${opt.id || "g"}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>`;
  if (opt.colTitles) L.cols.forEach((c, l) => { const t = opt.colTitles(l, L.cols.length); if (t && c.length) svg += `<text class="g-col" x="${16 + l * (W + (opt.gx || 70))}" y="22">${esc(t)}</text>`; });
  edges.forEach(e => {
    const a = xy[e.from], b = xy[e.to]; if (!a || !b) return;
    let d;
    if (b.x > a.x) { const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2; d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; }
    else { const x1 = a.x + W / 2, y1 = a.y, x2 = b.x + W / 2, y2 = b.y, top = Math.min(y1, y2) - 26; d = `M${x1},${y1} C${x1},${top} ${x2},${top} ${x2},${y2}`; }
    svg += `<path class="g-edge ${e.cls || ""}" data-a="${esc(e.from)}" data-b="${esc(e.to)}" d="${d}" marker-end="url(#ar-${opt.id || "g"})"><title>${esc(e.title || "")}</title></path>`;
  });
  nodes.forEach(n => {
    const p = xy[n.id]; if (!p) return;
    svg += `<g class="g-node ${n.cls || ""}" data-id="${esc(n.id)}" ${n.go ? `data-go="${n.go[0]}" data-arg="${esc(n.go[1])}" tabindex="0" role="button"` : ""} transform="translate(${p.x},${p.y})">
      <title>${esc(n.title || n.label)}</title><rect width="${W}" height="${H}" rx="7"/>
      <text class="g-kind" x="9" y="13">${esc(trunc(n.kind || "", 30))}</text>
      <text class="g-label" x="9" y="29">${esc(trunc(n.label, Math.floor(W / 7.3)))}</text>
      ${n.sub ? `<text class="g-sub" x="9" y="${H - 6}">${esc(trunc(n.sub, Math.floor(W / 5.8)))}</text>` : ""}</g>`;
  });
  return svg + "</svg>";
}

/* ============================================================ data flow */
function dataflowGraph() {
  const keep = r => !["variable", "parameter", "system"].includes(r.kind) || r.output;
  const edges = new Map();
  const relsOf = st => {
    const reads = new Set(st.reads.filter(k => REL[k]));
    st.uses.forEach(u => { if (REL[u.rel] && u.col === ROWS) reads.add(u.rel); });
    st.nodes.forEach(nid => (NODES[nid].uses || []).forEach(u => { if (REL[u.rel] && u.rel !== NODES[nid].rel) reads.add(u.rel); }));
    return reads;
  };
  DATA.steps.forEach(st => {
    const writes = new Set(st.writes.filter(k => REL[k]));
    if (!writes.size) return;
    relsOf(st).forEach(a => writes.forEach(b => {
      if (a === b) return;
      const k = a + "\u0000" + b;
      if (!edges.has(k)) edges.set(k, {from: a, to: b, steps: [], cond: true, dyn: false});
      const e = edges.get(k); e.steps.push(st.id);
      if (!st.conditions.length) e.cond = false;
      if (st.origin === "dynamic") e.dyn = true;
    }));
  });
  // variables only when they carry values between tables
  let es = [...edges.values()];
  const varKeep = new Set();
  DATA.relations.filter(r => r.kind === "variable").forEach(r => {
    const inT = es.some(e => e.to === r.key && REL[e.from] && REL[e.from].kind !== "variable");
    const outT = es.some(e => e.from === r.key && REL[e.to] && !["variable", "parameter"].includes(REL[e.to].kind));
    if (inT && outT) varKeep.add(r.key);
  });
  const used = new Set();
  es = es.filter(e => (keep(REL[e.from]) || varKeep.has(e.from)) && (keep(REL[e.to]) || varKeep.has(e.to)));
  es.forEach(e => { used.add(e.from); used.add(e.to); });
  DATA.relations.forEach(r => { if ((r.role === "input" || r.role === "output" || r.role === "both") && keep(r)) used.add(r.key); });
  const cls = r => r.kind === "variable" ? "n-var" : r.kind === "result" || r.kind === "return" || r.kind === "parameter" ? "n-res" :
    r.kind === "dynamic" ? "n-dyn" : r.role === "input" ? "n-src" : r.role === "both" ? "n-both" : r.role === "output" ? "n-snk" : "n-mid";
  const nodes = [...used].filter(k => REL[k]).map(k => { const r = REL[k];
    return {id: k, label: r.name, kind: KIND_NAMES[r.kind] || r.kind, sub: r.kind === "result" ? plural((r.columns || []).length, "column") : (r.ops || []).join(" · "),
      cls: cls(r) + (SEL_REL === k ? " n-focus" : ""), go: ["dfnode", k], title: r.name}; });
  const gedges = es.map(e => ({from: e.from, to: e.to, cls: (e.dyn ? "e-dyn " : "") + (e.cond ? "e-cond" : ""),
    title: `${relName(e.from)} → ${relName(e.to)}: step${e.steps.length > 1 ? "s" : ""} ${e.steps.map(s => STEP[s].label).join(", ")}${e.cond ? " (conditional)" : ""}`}));
  return {nodes, edges: gedges};
}

/* ============================================================ steps */

  const conds = st.conditions.length ? `<div class="kv"><div class="k">Runs when</div><div>${st.conditions.map(c => `${c.step ? stepLink(c.step) : ""} <span class="mut">${c.branch === "else" ? "NOT" : c.branch === "loop" ? "loop while" : c.branch === "catch" ? "" : ""}</span> <code>${esc(c.text)}</code>`).join("<br>")}</div></div>` : "";
  const writes = st.nodes.map(id => NODES[id]).filter(n => n.op !== "local" && n.col !== ROWS);
  const wrows = writes.length ? `<div class="table-wrap"><table class="t" style="margin:.4rem 0"><thead><tr><th>Writes</th><th>Value</th><th>From</th></tr></thead><tbody>
    ${writes.slice(0, 60).map(n => `<tr><td><b>${esc(nodeLabel(n.id))}</b>${n.keeps ? ' <span class="badge b-warn" title="Rows not matched keep their earlier value">some rows</span>' : ""}${n.st ? " " + statusBadge(n.st) : ""}</td>

      <td>${(n.uses || []).filter(u => u.d).map(u => `<span class="chipref src">${esc(colName(u.rel, u.col))}</span>`).join(" ")}</td></tr>`).join("")}
    ${writes.length > 60 ? `<tr><td colspan="3" class="mut">${writes.length - 60} more columns</td></tr>` : ""}</tbody></table></div>` : "";
  const reads = st.reads.filter(k => REL[k] || LOCAL[k]);
  const io = `${reads.length ? `<div class="kv"><div class="k">Reads</div><div class="pill-list">${reads.map(relChip).join("")}</div></div>` : ""}
    ${st.writes.length ? `<div class="kv"><div class="k">Writes</div><div class="pill-list">${st.writes.filter(k => REL[k]).map(relChip).join("")}</div></div>` : ""}`;
  const marks = [];
  writes.forEach(n => { if (n.span && !n.text) marks.push({s: n.span[0], e: n.span[1], cls: "m-w"}); });
  const code = st.span ? excerpt(st.text, st.head || st.span, marks) : "";
  const dyn = st.kind === "exec-dynamic" ? (DATA.dynamic.find(d => d.step === st.label) || null) : null;
  const dynInfo = dyn ? `<div class="callout ${dyn.status === "resolved" ? "info" : dyn.status === "partial" ? "warn" : "bad"}">Dynamic SQL: <b>${esc(dyn.status)}</b>${dyn.placeholders && dyn.placeholders.length ? ` · run-time values: ${dyn.placeholders.map(p => `<code>${esc(p)}</code>`).join(" ")}` : ""}${dyn.parsed ? " · the rebuilt statement is analysed as the nested steps below" : ""}${(dyn.errors || []).length ? `<div class="mut">${esc(dyn.errors[0])}</div>` : ""}</div>` : "";
  const isslist = iss.length ? `<div class="kv"><div class="k">Review</div><div>${iss.map(i => `${sevBadge(i.severity)} ${go("issue", i.id, md(i.title))}`).join("<br>")}</div></div>` : "";
  const traceable = writes.filter(n => outputOf(n.id).length);
  const traceLinks = traceable.length ? `<div class="kv"><div class="k">Trace</div><div class="pill-list">${[...new Set(traceable.map(n => outputOf(n.id)[0].key))].slice(0, 10).map(k => go("trace", k, esc(colName(OUT[k].rel, OUT[k].col)), "chipref snk")).join("")}</div></div>` : "";
  return `<details class="act${st.reachable ? "" : " unreach"}" id="st-${slug(st.id)}"><summary><span class="sn">${esc(st.label)}</span>${kindBadge(st.kind)}<span class="sm">${md(st.summary)}${!st.reachable ? ' <span class="badge b-muted">never runs</span>' : ""}</span>${badges}<span class="ln">${esc(lines(st))}</span></summary>
    <div class="body">${st.comment ? `<div class="comment">${esc(st.comment)}</div>` : ""}${conds}${io}${dynInfo}${isslist}${traceLinks}${wrows}${code}
    <div class="toolbar">${st.span ? go("codestep", st.id, "Open in code", "ghost-btn") : ""}</div></div></details>`;

/* ============================================================ control flow */
function fstep(st) {
  const k = KIND_CLASS[st.kind] || "";
  const iss = st.issues.some(i => DATA.issues[i] && (DATA.issues[i].severity === "high" || DATA.issues[i].severity === "medium"));
  const txt = st.summary.replace(/`/g, "");

}
const PLAIN = new Set(["insert", "update", "delete", "merge", "select", "select-into", "select-assign", "set", "declare", "declare-table", "create-table", "drop-table", "truncate", "print", "set-option", "fetch", "open-cursor", "close-cursor", "deallocate-cursor", "declare-cursor", "insert-exec", "alter-table", "create-index", "other", "label"]);

function checklistMd(key) {

  out += `Computed from: ${[...new Set(model.bases.map(nodeLabel))].join(", ") || "no input column"}\n\n## Checklist\n\n`;
  model.ordered.forEach(e => {

    out += `- [ ] **Step ${st.label}** (${lines(st)}) — ${e.role === "value" ? "writes the value" : e.role === "cond" ? "decides the branch" : "decides which rows"}: ${strip(st.summary)}\n`;
    e.nodes.map(x => NODES[x.id]).filter(n => n.col !== ROWS && n.op !== "local").forEach(n => { out += `  - ${nodeLabel(n.id)} = \`${strip(n.expr)}\`${n.keeps ? " (only some rows)" : ""}\n`; });
    if (st.detail.where) out += `  - rows where \`${strip(st.detail.where)}\`\n`;
    if (st.detail.on) out += `  - matched on \`${strip(st.detail.on)}\`\n`;
    st.conditions.forEach(c => { out += `  - only when ${c.branch === "else" ? "NOT " : ""}\`${strip(c.text)}\`\n`; });
    st.issues.map(i => DATA.issues[i]).filter(Boolean).forEach(i => { out += `  - check: ${strip(i.title)} — ${strip(i.next)}\n`; });

}

/* ============================================================ lineage graph */

  else { sl = backward(OUT[LIN_KEY].defs, LIN_INDIRECT); title = `Where ${colName(OUT[LIN_KEY].rel, OUT[LIN_KEY].col)} comes from`; focus = new Set(OUT[LIN_KEY].defs); }

  const limit = 140;

  if (LIN_INDIRECT || LIN_SRC != null) ids.forEach(id => { const n = NODES[id]; if (n.step == null || n.op === "local") return; const st = STEP[n.step];
    st.uses.forEach(u => u.defs.forEach(d => { if (keep.has(d) && NODES[d].col !== ROWS) edges.push({from: d, to: id, cls: "e-ind", title: `${nodeLabel(d)} decides rows of ${nodeLabel(id)} (${ROLE_TEXT[u.role] || u.role})`}); })); });
  const seenE = new Set();
  const uniq = edges.filter(e => { const k = e.from + ">" + e.to + e.cls; if (seenE.has(k)) return false; seenE.add(k); return true; });
  const nodes = ids.map(id => { const n = NODES[id]; const r = REL[n.rel];
    const cls = focus.has(id) ? "n-focus" : n.op === "initial" ? "n-src" : n.op === "local" ? "n-local" : r && (r.role === "output" || r.role === "both") ? "n-snk" : r && r.kind === "variable" ? "n-var" : "n-mid";
    return {id, label: nodeLabel(id), kind: versionLabel(id), sub: n.expr ? n.expr : (n.note || ""), cls, go: ["linnode", id], title: `${nodeLabel(id)} ${versionLabel(id)}\n${n.expr || ""}`}; });
  const srcs = NODES.filter(n => n.op === "initial" && n.col !== ROWS && REL[n.rel] && REL[n.rel].kind !== "variable");

  const sopts = `<option value="">— or a source column —</option>` + srcs.map(n => `<option value="${n.id}"${n.id === LIN_SRC ? " selected" : ""}>${esc(nodeLabel(n.id))}</option>`).join("");
  const affected = LIN_SRC != null ? DATA.outputs.filter(o => o.defs.some(d => sl.has(d))) : [];
  return `<h1>Lineage graph</h1><p class="sub">${esc(title)}. Each box is one version of a column (a temp table column after step 7 is a different box from the same column after step 12). Solid arrows carry the value; dashed arrows decide which rows or which branch. Select a box to re-centre on it.</p>
  <div class="filter-row"><select onchange="if(this.value){LIN_KEY=this.value.slice(2);LIN_SRC=null;switchTab('lineage',true)}">${opts}</select><select onchange="if(this.value){GO.linsrc(this.value)}">${sopts}</select>${LIN_KEY ? `<label class="toggle"><input type="checkbox" ${LIN_INDIRECT ? "checked" : ""} data-go="linopt"> include joins, filters and conditions</label> ` + go("trace", LIN_KEY, "Open column trace", "ghost-btn") : ""}</div>
  ${affected.length ? `<div class="card"><b>Feeds ${plural(affected.length, "output column")}:</b> <div class="pill-list" style="margin-top:.3rem">${affected.map(o => go("trace", o.key, esc(colName(o.rel, o.col)), "chipref snk")).join("")}</div></div>` : ""}
  <div class="legend"><span><i class="lg n-src"></i>value before the procedure</span><span><i class="lg n-mid"></i>staged version</span><span><i class="lg n-local"></i>inside one statement (CTE, derived)</span><span><i class="lg n-snk"></i>output</span><span><i class="lg n-focus"></i>selected</span><span><i class="lg e e-dir"></i>value</span><span><i class="lg e e-ind"></i>rows / branch</span></div>

  if (name === "inputs") rows = [["object", "kind", "columns_used", "read_by_steps"], ...ins.map(r => [r.name, r.kind, Object.keys(r.colReads || {}).join(" "), (r.reads || []).map(s => STEP[s].label).join(" ")])];
  else if (name === "outputs") rows = [["output", "kind", "operations", "written_by_steps"], ...outsRel.map(r => [r.name, r.kind, (r.ops || []).join(" "), (r.writes || []).map(s => STEP[s].label).join(" ")])];
  else if (name === "columns") rows = [["output", "column", "status", "direct_sources", "steps", "conditions"], ...outCols.map(o => [relName(o.rel), o.col, o.status, o.direct.map(([r, c]) => colName(r, c)).join("; "), o.steps.map(s => STEP[s].label).join(" "), o.conditions.map(c => (c.branch === "else" ? "NOT " : "") + c.text).join("; ")])];
  else if (name === "steps") rows = [["step", "kind", "first_line", "last_line", "summary", "reads", "writes"], ...DATA.steps.map(s => [s.label, s.kind, s.lines ? s.lines[0] : "", s.lines ? s.lines[1] : "", s.summary.replace(/`/g, ""), s.reads.map(relName).join("; "), s.writes.map(relName).join("; ")])];
  else if (name === "issues") rows = [["severity", "certainty", "rule", "title", "why", "next_step", "steps"], ...DATA.issues.map(i => [i.severity, i.certainty, i.rule, i.title, i.why, i.next, i.steps.map(s => STEP[s] ? STEP[s].label : s).join(" ")])];
  else if (name === "matrix") rows = [["output_column", ...DATA.matrixRelations.map(relName)], ...outCols.map(o => [colName(o.rel, o.col), ...DATA.matrixRelations.map(r => o.matrix[r] || "")])];
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${(P.name || "procedure").replace(/[^A-Za-z0-9_.-]+/g, "_")}-${name}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============================================================ boot */
const RENDER = {overview: rOverview, inputs: rInputs, outputs: rOutputs, intermediates: rIntermediates, columns: rColumns, dataflow: rDataflow,
  steps: rSteps, control: rControl, transforms: rTransforms, code: rCode, trace: rTrace, lineage: rLineage, matrix: rMatrix, calls: rCalls,
  issues: rIssues, complexity: rComplexity, details: rDetails};
buildNav();
(function start() {
  const h = (location.hash || "").slice(1);
  const m = /^trace=(.+)$/.exec(h);
  if (m && OUT[decodeURIComponent(m[1])]) { TRACE_KEY = decodeURIComponent(m[1]); switchTab("trace"); return; }
  if (TABS.find(t => t.id === h)) { switchTab(h); return; }
  switchTab("overview");
})();

/* ============================================================ library viewer bridge
   bi-doc-viewer protocol v1. Active only when this page is framed (by the library shell).
   Messages are accepted only from the parent window, with an exact shape; they carry a
   per-load channel, the revision ID and a registered view ID with string arguments,
   never HTML, scripts or URLs. */
const VIEWER_VIEWS = {
  "sql.overview": () => { switchTab("overview"); return true; },
  "sql.step": a => { const st = DATA.steps.find(s => s.label === a.step || s.id === a.step); if (!st) return false; GO.step(st.id); return true; },
  "sql.column": a => { const o = DATA.outputs.find(o => (relName(o.rel).toLowerCase() === String(a.relation || "").toLowerCase() || o.rel === a.relation) && o.col.toLowerCase() === String(a.column || "").toLowerCase()); if (!o) return false; GO.trace(o.key); return true; },
  "sql.object": a => { const r = DATA.relations.find(r => r.name.toLowerCase() === String(a.object || "").toLowerCase() || r.key === a.object); if (!r) return false; GO.rel(r.key); return true; },
  "sql.issue": a => { const i = DATA.issues.find(i => String(i.id) === String(a.issue) || i.rule === a.issue); if (!i) return false; GO.issue(i.id); return true; },
};
(function () {
  if (window.parent === window || !window.addEventListener) return;
  let channel = null, revision = null;
  const str = v => typeof v === "string" && v.length > 0 && v.length <= 512;
  const reply = msg => window.parent.postMessage(Object.assign({protocol: "bi-doc-viewer", version: 1, channel, revision_id: revision}, msg), "*");
  window.addEventListener("message", ev => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || typeof m !== "object" || m.protocol !== "bi-doc-viewer" || m.version !== 1) return;
    if (m.type === "hello") {
      if (channel !== null || !str(m.channel) || !str(m.revision_id)) return;
      channel = m.channel; revision = m.revision_id;
      reply({type: "viewer-ready", views: Object.keys(VIEWER_VIEWS)});
      return;
    }
    if (m.type !== "navigate-object" || m.channel !== channel || m.revision_id !== revision) return;
    if (!str(m.view_id) || !Object.prototype.hasOwnProperty.call(VIEWER_VIEWS, m.view_id)) return;
    const args = {};
    if (m.args && typeof m.args === "object") for (const [k, v] of Object.entries(m.args)) {
      if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") { const s = String(v); if (s.length <= 512) args[k] = s; }
    }
    let exact = false;
    try { exact = !!VIEWER_VIEWS[m.view_id](args); } catch (e) { exact = false; }
    reply({type: "navigated", object_id: str(m.object_id) ? m.object_id : null, exact});
  });
})();
